name: Автопостинг в Telegram-канал

on:
  schedule:
    # Каждые 2 часа. Синтаксис cron — минуты часы * * *, время в UTC
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # позволяет запускать вручную из вкладки Actions

permissions:
  contents: write  # нужно, чтобы коммитить обновлённый posted.json обратно в репозиторий

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python bot.py

      - name: Commit updated posted.json
        run: |
          git config user.name "travel-bot"
          git config user.email "travel-bot@users.noreply.github.com"
          git add posted.json
          git diff --staged --quiet || git commit -m "Обновлён список опубликованных постов"
          git push
