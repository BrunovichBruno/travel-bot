name: Автопостинг в Telegram-канал

on:
  schedule:
    - cron: '0 6-22/2 * * 1-5'
    - cron: '0 8-20/3 * * 0,6'
  workflow_dispatch:

# Запрещаем параллельные запуски одного workflow
concurrency:
  group: telegram-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          GEMINI_MODEL: gemini-3.6-flash
          DRY_RUN: "false"
        run: python bot.py

      # Коммитим даже если бот упал — чтобы не потерять posted.json
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.json poll_state.json telegram_history.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push || echo "Nothing to push"
