name: Автопостинг в Telegram-канал

on:
  schedule:
    # Будни (Пн-Пт): каждые 2 часа с 6:00 до 22:00 UTC
    - cron: '0 6-22/2 * * 1-5'

    # Выходные (Сб, Вс): каждые 3 часа с 8:00 до 22:00 UTC
    - cron: '0 8-20/3 * * 0,6'

  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Запуск бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
          GEMINI_MODEL: gemini-3.6-flash
          DRY_RUN: "false"
        run: python bot.py

      - name: Сохранить posted.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posted.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted.json [skip ci]"
          git push
